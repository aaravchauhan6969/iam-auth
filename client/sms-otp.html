<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Verify Mobile</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <div class="register-card">

            <div class="icon">
                📱
            </div>

            <h1>Verify your mobile</h1>

            <p class="subtitle">
                Enter the 6-digit code sent to your mobile.
            </p>

            <form id="smsOtpForm">

                <label for="smsOtp">
                    SMS OTP
                </label>

                <input
                    type="text"
                    id="smsOtp"
                    maxlength="6"
                    placeholder="Enter 6-digit OTP"
                >

                <p id="smsOtpMessage"></p>

                <button
                    type="submit"
                    class="register-btn"
                >
                    Verify Mobile
                </button>

            </form>

        </div>

    </div>

    <script src="sms-otp.js"></script>

</body>

</html>
